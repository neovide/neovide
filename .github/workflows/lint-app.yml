name: Lint App

permissions:
  checks: write
  contents: read

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  rustfmt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned rustfmt toolchain
        run: rustup toolchain install --no-self-update --component rustfmt

      - name: Run rustfmt
        run: cargo fmt --all --check
